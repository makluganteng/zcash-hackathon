[package]
name = "sealed-address-bindings"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1"
toml = "0.8"
uuid = "1"
zcash_address = "=0.14.0-pre.0"
zcash_keys = { version = "=0.17.0-pre.0", features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = "=0.11.0-pre.0"
zip32 = "0.3"

[lints.rust]
unsafe_code = "forbid"
